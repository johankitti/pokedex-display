; PlatformIO project for the Pokédex Display
; Board: Waveshare ESP32-S3-Zero (same chip config as lolin_s3_mini)
; See docs/hardware-reference.md for wiring and power.

[env:s3mini]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200

; Web setup portal (WiFiManager) needs more app space than the default ~1.3MB
; slot. huge_app = 3MB app / no OTA — plenty on the 4MB flash.
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1   ; serial logs over native USB
    -DARDUINO_USB_MODE=1

lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.0
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit BusIO@^1.16.0
    bitbank2/AnimatedGIF@^2.1.0
    bitbank2/PNGdec@^1.0.3
    madhephaestus/ESP32Encoder@^0.11.7
    https://github.com/tzapu/WiFiManager.git
